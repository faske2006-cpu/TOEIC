<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI TOEIC 全方位單字學習與 SRS 複習系統 (Gist 雙向自動同步版)</title>

<style>
:root {
    /* 莫蘭迪基調 */
    --bg-main: #f4f1ea;
    --card-bg: #ffffff;
    --text-main: #383735;
    --text-muted: #787571;
    --border-color: #e2ded7;
    --border-dashed: #d4cfc7;
    
    /* 莫蘭迪色彩系統 */
    --color-primary: #5c7080;       /* 煙藍 */
    --color-primary-hover: #4a5c6b;
    --color-success: #6c8d7b;       /* 苔綠 */
    --color-danger: #b86b6b;        /* 乾燥玫瑰紅 */
    --color-warning: #c69b6e;       /* 暖亞麻黃 */
    --color-secondary: #8c8984;     /* 靜謐灰 */
    --color-voice-female: #a67c8e;  /* 藕粉 */
    --color-voice-male: #637d94;    /* 灰藍 */

    /* 圓角與陰影 */
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
    --shadow-soft: 0 4px 16px rgba(60, 50, 40, 0.04);
    --shadow-sticky: 0 8px 20px rgba(60, 50, 40, 0.08);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-main);
    margin: 0;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    color: var(--text-main);
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-top: 6px;
    margin-bottom: 16px;
    text-align: center;
    color: var(--text-main);
    letter-spacing: 0.3px;
}

h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 0;
    color: var(--text-main);
}

.card {
    background: var(--card-bg);
    padding: 16px;
    border-radius: var(--radius-lg);
    margin-bottom: 14px;
    box-shadow: var(--shadow-soft);
    border: 1px solid var(--border-color);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#resultContainer {
    scroll-margin-top: 120px;
}

/* 📱 手機優化：固定搜尋列 */
.sticky-search {
    position: sticky;
    top: max(10px, env(safe-area-inset-top));
    z-index: 1000;
    box-shadow: var(--shadow-sticky);
    border-color: #d8d3cb;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.92);
    padding: 12px;
}

.search-controls-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.api-box {
    background: #f7f5f0;
    border: 1px solid var(--border-color);
    padding: 12px 14px;
    border-radius: var(--radius-md);
    font-size: 0.88rem;
}

.api-box input {
    margin-top: 6px;
    margin-bottom: 8px;
    font-family: monospace;
    width: 100%;
}

input, select {
    padding: 12px 14px;
    margin-top: 4px;
    margin-bottom: 4px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    width: 100%;
    background-color: #fcfbf9;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s, background-color 0.2s;
    min-height: 44px;
}

input:focus, select:focus {
    border-color: var(--color-primary);
    background-color: #ffffff;
}

select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c787571' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 36px;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 0.2px;
    min-height: 42px;
    touch-action: manipulation;
}

button:hover {
    filter: brightness(0.95);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    background: #d6d2cb !important;
    color: #9c9890 !important;
    cursor: not-allowed;
    transform: none !important;
}

.btn-sm {
    padding: 8px 10px;
    font-size: 0.82rem;
    min-height: 36px;
}

.btn-xs {
    padding: 5px 8px;
    font-size: 0.78rem;
    border-radius: var(--radius-sm);
    min-height: 30px;
}

.primary { background: var(--color-primary); color: white; }
.success { background: var(--color-success); color: white; }
.danger { background: var(--color-danger); color: white; }
.secondary { background: var(--color-secondary); color: white; }
.warning { background: var(--color-warning); color: white; }
.voice-female { background: var(--color-voice-female); color: white; }
.voice-male { background: var(--color-voice-male); color: white; }

.control-panel {
    background: #f8f6f1;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.control-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.search-input-wrap {
    position: relative;
    width: 100%;
}

.search-input-wrap input {
    margin: 0;
    padding-right: 36px;
}

.clear-search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 6px;
    display: none;
    min-height: auto;
}

.clear-search-btn:hover {
    color: var(--text-main);
    background: transparent;
}

.control-panel select {
    margin: 0;
    width: 100%;
}

/* 📱 手機優化：工具列網格佈局 */
.toolbar-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-dashed);
}

.toolbar-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.toolbar-card {
    background: #f2efe9;
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
}

.toolbar-card-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
}

.toolbar-btn-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.toolbar-btn-group button {
    width: 100%;
    padding: 6px 2px;
    font-size: 0.78rem;
    margin: 0;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}

.stat-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
    font-size: 0.8rem;
    text-align: center;
}

.stat-badge {
    padding: 6px 4px;
    border-radius: var(--radius-md);
    background: #f0ebe1;
    color: var(--text-main);
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.stat-badge span {
    font-size: 0.95rem;
    font-weight: 700;
}

.stat-badge.due { background: #f3e2e2; color: #8c3b3b; }
.stat-badge.mastered { background: #e2ede5; color: #326042; }
.stat-badge.learning { background: #f7ede0; color: #8a5720; }

.word-card {
    border: 1px solid var(--border-color);
    padding: 14px;
    margin-top: 10px;
    border-radius: var(--radius-md);
    background: #fdfcf9;
    width: 100%;
}

.word-card-top {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-dashed);
}

.word-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.srs-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 6px;
    padding: 8px 10px;
    background: #f5f2eb;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
}

.srs-star {
    color: #d99b26;
    font-weight: bold;
    letter-spacing: 1px;
}

.srs-due-tag {
    background: #f3e2e2;
    color: #8c3b3b;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.75rem;
}

.srs-ok-tag {
    background: #e2ede5;
    color: #326042;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
}

.alert-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
    margin-left: 4px;
    line-height: 1.2;
}

.badge-irregular-verb {
    background-color: #f5e1e1;
    color: #8a3333;
    border: 1px solid #ebd0d0;
}

.badge-irregular-noun {
    background-color: #f8ebe0;
    color: #8a5323;
    border: 1px solid #eddcca;
}

.badge-same-form {
    background-color: #e0e9f0;
    color: #2b5578;
    border: 1px solid #cee0ec;
}

.irregular-highlight {
    font-weight: 600;
    color: #2b2927;
    background: #f5ebd8;
    padding: 1px 4px;
    border-radius: 3px;
}

details {
    width: 100%;
}

details summary {
    cursor: pointer;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--color-primary);
    user-select: none;
    line-height: 1.4;
}

.detail-content {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-dashed);
    font-size: 0.9rem;
    line-height: 1.5;
    width: 100%;
    color: var(--text-main);
}

.detail-content p {
    margin: 6px 0;
}

.example-wrapper {
    margin-top: 10px;
}

.example-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-muted);
}

.example-voices {
    display: flex;
    gap: 4px;
}

.example-box {
    padding: 8px 10px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--color-primary);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.example-en {
    color: var(--text-main);
    font-weight: 500;
    line-height: 1.4;
    font-size: 0.9rem;
}

.zh-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    vertical-align: middle;
}

.zh-toggle-btn {
    background: #eae6de;
    color: var(--text-muted);
    border: 1px solid var(--border-color);
    cursor: pointer;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 0.75rem;
    line-height: 1;
    min-height: 24px;
}

.zh-text.hidden {
    display: none !important;
}

.pos-tag {
    font-size: 0.85rem;
    color: var(--color-danger);
    font-style: italic;
    margin-left: 2px;
}

.phonetic-tag {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-left: 2px;
    font-weight: normal;
}

.category-badge {
    display: inline-block;
    background: #e5edf2;
    color: #3b6078;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
}

.status-log-box {
    background: #f6f4ee;
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--color-primary);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    line-height: 1.5;
}

.status-log-box .log-item {
    margin-bottom: 4px;
    color: var(--text-muted);
}

.status-log-box .log-active {
    color: var(--color-primary);
    font-weight: 600;
}

.status-log-box .log-error {
    color: var(--color-danger);
}

.count-badge-box {
    display: inline-flex;
    gap: 6px;
    font-size: 0.78rem;
    background: #f0ebe1;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
}

/* 💻 平板與大螢幕適應 */
@media (min-width: 650px) {
    body { padding: 24px; }
    h1 { font-size: 1.75rem; }
    .toolbar-grid { grid-template-columns: repeat(3, 1fr); }
    .word-card-top { flex-direction: row; justify-content: space-between; align-items: center; }
    .word-actions { display: flex; }
    .control-row { flex-wrap: nowrap; }
    .search-input-wrap { width: auto; flex-grow: 1; }
    .control-panel select { width: auto; flex-grow: 1; }
    .stat-bar { display: flex; flex-wrap: wrap; text-align: left; }
    .stat-badge { flex-direction: row; gap: 4px; padding: 5px 12px; border-radius: 20px; }
    .stat-badge span { font-size: 0.85rem; }
}
</style>
</head>

<body>

<div class="container">
    <h1>📚 AI TOEIC 全方位單字學習系統</h1>

    <div class="card api-box">
        <details id="settingsDetails">
            <summary>⚙️ 系統與雲端連線設定 (Gemini & GitHub Gist)</summary>
            <div style="margin-top:12px;">
                <label><strong>🔑 Gemini API Key：</strong></label>
                <input id="apiKeyInput" type="text" placeholder="貼上您的 Gemini API Key" onchange="saveSettings(false)">

                <div style="margin-top:12px; border-top: 1px dashed var(--border-dashed); padding-top: 10px;">
                    <label><strong>🐙 GitHub Personal Access Token：</strong></label>
                    <input id="githubTokenInput" type="text" placeholder="帶有 gist 權限的 GitHub Token" onchange="saveSettings(false)">
                    
                    <label style="margin-top:8px; display:block;"><strong>📄 GitHub Gist ID：</strong></label>
                    <input id="gistIdInput" type="text" placeholder="留空將自動尋找並綁定" onchange="saveSettings(false)">
                </div>

                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button class="primary btn-sm" style="flex:2;" onclick="saveSettings(true)">💾 儲存並同步</button>
                    <button class="secondary btn-sm" style="flex:1;" onclick="resetToDefault()">🔄 重置</button>
                </div>
            </div>
        </details>
    </div>

    <!-- Sticky 搜尋區塊 (手機高度與排版優化) -->
    <div class="card sticky-search">
        <input id="wordInput" placeholder="輸入英文單字或中文..." onkeydown="handleKeyDown(event)">
        <div class="search-controls-row">
            <button id="searchBtn" class="primary" style="flex:2;" onclick="lookupWord()">🤖 Gemini 分析</button>
            <button class="voice-female" style="flex:1;" onclick="speakText(null, 'female')">👩 女聲</button>
            <button class="voice-male" style="flex:1;" onclick="speakText(null, 'male')">👨 男聲</button>
        </div>
    </div>

    <div class="card" id="resultContainer">
        <h2>AI 分析結果</h2>
        <div id="result" style="color:var(--text-muted); font-size: 0.9rem;">請輸入單字或中文進行查詢</div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                我的單字庫
                <div class="count-badge-box">
                    <span>💻 <strong id="localWordCount">0</strong></span>
                    <span>|</span>
                    <span>☁️ <strong id="cloudWordCount">-</strong></span>
                </div>
            </h2>
            <div id="syncStatusInfo" style="font-size:0.78rem; color:var(--text-muted); background:#f8f6f1; border:1px solid var(--border-color); padding:3px 8px; border-radius:6px;">
                ☁️ 檢查中...
            </div>
        </div>
        
        <div class="stat-bar" id="statBar">
            <div class="stat-badge due">🎯 待複習 <span id="statDue">0</span></div>
            <div class="stat-badge learning">📖 學習中 <span id="statLearning">0</span></div>
            <div class="stat-badge mastered">🏆 已精通 <span id="statMastered">0</span></div>
        </div>

        <div class="control-panel">
            <div class="control-row">
                <div class="search-input-wrap">
                    <input id="filterInput" placeholder="🔍 搜尋已儲存單字..." oninput="handleFilterInput()">
                    <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearchFilter()">✖</button>
                </div>
            </div>
            
            <div class="control-row">
                <select id="sortSelect" onchange="renderWordList()">
                    <option value="time-desc" selected>⏱️ 時間 (最新 ➔ 最舊)</option>
                    <option value="time-asc">⏱️ 時間 (最舊 ➔ 最新)</option>
                    <option value="srs-level-asc">⭐ 熟練度 (低 ➔ 高)</option>
                    <option value="srs-level-desc">⭐ 熟練度 (高 ➔ 低)</option>
                    <option value="alpha-asc">🔤 字母 (A ➔ Z)</option>
                    <option value="alpha-desc">🔤 字母 (Z ➔ A)</option>
                    <option value="srs-due">🎯 複習優先</option>
                </select>
                <button id="filterDueBtn" class="warning" style="width:100%;" onclick="toggleDueOnlyFilter()">🎯 待複習 (<span id="dueCount">0</span>)</button>
            </div>

            <div class="toolbar-section">
                <div class="toolbar-grid">
                    <!-- 雲端與備份 -->
                    <div class="toolbar-card">
                        <div class="toolbar-card-title">☁️ 雲端與備份</div>
                        <div class="toolbar-btn-group">
                            <button class="success btn-sm" onclick="performFullSync(true)">🔄 同步</button>
                            <button class="warning btn-sm" onclick="pullCloudToLocal(true)">☁️ 蓋本地</button>
                            <button class="danger btn-sm" onclick="clearLocalDatabase()">🗑️ 清空</button>
                        </div>
                    </div>

                    <!-- 檢視與顯示 -->
                    <div class="toolbar-card">
                        <div class="toolbar-card-title">👁️ 展開與翻譯</div>
                        <div class="toolbar-btn-group">
                            <button class="secondary btn-sm" onclick="toggleAllDetails(true)">📂 展開</button>
                            <button class="secondary btn-sm" onclick="toggleAllDetails(false)">📁 折疊</button>
                            <button class="secondary btn-sm" onclick="toggleAllTranslations()">👁️ 翻譯</button>
                        </div>
                    </div>

                    <!-- 資料與工具 -->
                    <div class="toolbar-card">
                        <div class="toolbar-card-title">🛠️ 資料管理</div>
                        <div class="toolbar-btn-group">
                            <button class="primary btn-sm" onclick="upgradeOldWords(event)">⚡ 補齊</button>
                            <button class="secondary btn-sm" onclick="exportData()">💾 匯出</button>
                            <button class="secondary btn-sm" onclick="document.getElementById('fileInput').click()">📥 匯入</button>
                        </div>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importData(event)">
            </div>
        </div>

        <div id="wordList"></div>
    </div>
</div>

<script>
const DEFAULT_API_KEY = "AQ.Ab8RN6LpVQW9YcWDK5DeBWkqgnarqq-bxoKSDYjaQWmGHFRYsQ";
const SRS_INTERVALS = [0, 1, 3, 7, 14, 30];

let filterDueOnly = false;
let currentResultData = null;

function getApiKey() {
    return localStorage.getItem("gemini_api_key") || DEFAULT_API_KEY;
}

function getGitHubToken() {
    return localStorage.getItem("github_token") || "";
}

function getGistId() {
    return localStorage.getItem("gist_id") || "";
}

function updateSyncStatusDisplay(type = 'normal') {
    const infoEl = document.getElementById("syncStatusInfo");
    if (!infoEl) return;
    
    const token = getGitHubToken();
    const gistId = getGistId();
    const lastSync = localStorage.getItem("last_sync_time");
    
    let timeStr = lastSync ? new Date(parseInt(lastSync)).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '未同步';
    let shortGist = gistId ? ` (...${gistId.slice(-4)})` : '';

    if (!token) {

function safeParseJSON(jsonStr) {
    if (!jsonStr) throw new Error("傳入資料為空");
    try {
        return JSON.parse(jsonStr);
    } catch (e1) {
        console.warn("解析修復...", e1);
    }

    try {
        let cleaned = jsonStr
            .replace(/\r?\n/g, " ")
            .replace(/[\u0000-\u001F]+/g, " ")
            .replace(/,\s*([}\]])/g, '$1');
        return JSON.parse(cleaned);
    } catch (e2) {
        throw new Error(`JSON 解析失敗: (${e1.message})`);
    }
}

function getItemTime(item) {
    if (!item) return 0;
    let t = item.updatedAt || item.createdAt || 0;
    if (typeof t === 'string') t = Date.parse(t) || 0;
    return Number(t) || 0;
}

function mergeDatasets(localList, remoteList) {
    const map = new Map();

    const processItem = (item) => {
        if (!item || !item.word) return;
        const cleanName = sanitizeWord(item.word);
        const key = cleanName.toLowerCase();
        const itemTime = getItemTime(item);

        if (!map.has(key)) {
            map.set(key, { ...item, word: cleanName, updatedAt: itemTime });
        } else {
            const existing = map.get(key);
            const existingTime = getItemTime(existing);

            if (itemTime >= existingTime) {
                map.set(key, { ...existing, ...item, word: cleanName, updatedAt: itemTime });
            } else {
                map.set(key, { ...item, ...existing, word: cleanName, updatedAt: existingTime });
            }
        }
    };

    (Array.isArray(localList) ? localList : []).forEach(processItem);
    (Array.isArray(remoteList) ? remoteList : []).forEach(processItem);

    return Array.from(map.values());
}

async function performFullSync(interactive = false) {
    const token = getGitHubToken();
    if (!token) {
        if (interactive) alert("請填寫 GitHub Personal Access Token！");
        return;
    }

    updateSyncStatusDisplay('syncing');

    let gistId = getGistId();
    const fileName = "toeic_vocab_db.json";
    const description = "AI TOEIC 全方位單字學習系統 - 單字資料庫備份";
    let remoteWords = [];

    try {
        const timestamp = Date.now();

        if (!gistId) {
            const listRes = await fetch(`https://api.github.com/gists?per_page=100&t=${timestamp}`, {
                method: "GET",
                headers: { "Authorization": `token ${token}` }
            });
            if (listRes.ok) {
                const gists = await listRes.json();
                const existingGist = gists.find(g => g.files && g.files[fileName]);
                if (existingGist) {
                    gistId = existingGist.id;
                    localStorage.setItem("gist_id", gistId);
                    const gistInput = document.getElementById("gistIdInput");
                    if (gistInput) gistInput.value = gistId;
                }
            }
        }

        if (gistId) {
            const getRes = await fetch(`https://api.github.com/gists/${gistId}?t=${timestamp}`, {
                method: "GET",
                headers: { "Authorization": `token ${token}` }
            });

            if (!getRes.ok) throw new Error(`讀取雲端失敗 (HTTP ${getRes.status})`);

            const gistData = await getRes.json();
            const file = gistData.files[fileName] || Object.values(gistData.files)[0];
            if (file) {
                let contentStr = file.content;
                if (file.truncated && file.raw_url) {
                    const rawRes = await fetch(`${file.raw_url}?t=${timestamp}`);
                    if (!rawRes.ok) throw new Error("抓取完整備份失敗");
                    contentStr = await rawRes.text();
                }
                if (contentStr) remoteWords = safeParseJSON(contentStr);
            }
        }

        const cloudCountSpan = document.getElementById("cloudWordCount");
        if (cloudCountSpan) cloudCountSpan.textContent = remoteWords.filter(w => !w.isDeleted).length;

        const localWords = getWords();
        const mergedWords = mergeDatasets(localWords, remoteWords);

        saveWords(mergedWords, false);

        const content = JSON.stringify(mergedWords, null, 2);
        let pushRes;

        if (!gistId) {
            pushRes = await fetch("https://api.github.com/gists", {
                method: "POST",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ description, public: false, files: { [fileName]: { content } } })
            });
        } else {
            pushRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: "PATCH",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ description, files: { [fileName]: { content } } })
            });
        }

        if (!pushRes.ok) throw new Error("GitHub 上傳失敗");

        const pushData = await pushRes.json();
        if (!gistId) {
            gistId = pushData.id;
            localStorage.setItem("gist_id", gistId);
            const gistInput = document.getElementById("gistIdInput");
            if (gistInput) gistInput.value = gistId;
        }

        localStorage.setItem("last_sync_time", Date.now());
        updateSyncStatusDisplay('success');

        const activeCount = mergedWords.filter(w => !w.isDeleted).length;
        if (cloudCountSpan) cloudCountSpan.textContent = activeCount;

        if (interactive) alert(`✅ 雙向同步完成！(共 ${activeCount} 個單字)`);
    } catch (err) {
        console.error("同步失敗:", err);
        updateSyncStatusDisplay('error');
        if (interactive) alert(`❌ 同步失敗：${err.message}`);
    }
}

function sanitizeWord(word) {
    if (!word || typeof word !== 'string') return word;
    word = word.trim();
    if (/^[A-Z0-9\-\.\s]{2,}$/.test(word) && word === word.toUpperCase()) return word;

    const properNouns = [
        "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
        "january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december",
        "taiwan", "japan", "america", "english", "chinese"
    ];

    if (properNouns.includes(word.toLowerCase())) {
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }
    return word.toLowerCase();
}

function checkAndFixDatabaseWords(words) {
    let fixCount = 0;
    const seen = new Set();
    const uniqueWords = [];

    for (const item of words) {
        if (!item || !item.word) continue;
        let cleanedWord = sanitizeWord(item.word);
        const lowerWord = cleanedWord.toLowerCase();

        if (seen.has(lowerWord)) { fixCount++; continue; }
        seen.add(lowerWord);

        let updated = cleanedWord !== item.word;
        const mastery = typeof item.mastery === 'number' ? item.mastery : 0;
        const nextReviewDate = typeof item.nextReviewDate === 'number' ? item.nextReviewDate : 0;
        const lastReviewedAt = typeof item.lastReviewedAt === 'number' ? item.lastReviewedAt : 0;
        const createdAt = typeof item.createdAt === 'number' ? item.createdAt : Date.now();
        const updatedAtVal = typeof item.updatedAt === 'number' ? item.updatedAt : createdAt;
        const isDeleted = Boolean(item.isDeleted);

        if (updated || item.mastery === undefined || item.updatedAt === undefined) fixCount++;

        uniqueWords.push({
            ...item,
            word: cleanedWord,
            mastery,
            nextReviewDate,
            lastReviewedAt,
            createdAt,
            updatedAt: updatedAtVal,
            isDeleted
        });
    }

    if (fixCount > 0) localStorage.setItem("vocabDB", JSON.stringify(uniqueWords));
    return uniqueWords;
}

function speakText(textInput, gender = 'female') {
    const text = textInput || (currentResultData ? currentResultData.word : document.getElementById("wordInput").value);
    if (!text || typeof speechSynthesis === 'undefined') return;

    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";

    const voices = speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith('en'));
    const maleKeywords = ['guyonline', 'guy natural', 'evan', 'nathan', 'alex', 'david', 'fred', 'george', 'daniel', 'mark', 'james', 'brian', 'male'];

    let targetVoice = null;
    if (gender === 'male') {
        targetVoice = enVoices.find(v => maleKeywords.some(kw => v.name.toLowerCase().includes(kw)));
        if (targetVoice) utterance.voice = targetVoice;
        utterance.pitch = 0.85;
        utterance.rate = 0.85;
    } else {
        targetVoice = enVoices.find(v => ['jennyonline', 'ariaonline', 'samantha', 'zira', 'victoria', 'karen', 'female'].some(kw => v.name.toLowerCase().includes(kw)));
        if (targetVoice) utterance.voice = targetVoice;
        utterance.pitch = 1.0;
        utterance.rate = 0.9;
    }

    speechSynthesis.speak(utterance);
}

function safeJSONParseAI(rawText) {
    if (!rawText) throw new Error("AI 回傳空白內容");
    let jsonText = rawText.trim().replace(/^```json\s*/i, '').replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();

    if (jsonText.startsWith("<")) throw new Error("AI 回傳 HTML 格式而非 JSON，請重試。");

    try {
        return JSON.parse(jsonText);
    } catch (e1) {
        let cleaned = jsonText.replace(/,\s*([}\]])/g, '$1').replace(/[\u0000-\u001F]+/g, " ");
        return JSON.parse(cleaned);
    }
}

async function fetchGeminiAPI(prompt, onLog) {
    const apiKey = getApiKey();
    if (!apiKey) throw new Error("請先填寫 Gemini API Key！");

    const log = (msg, isError = false) => { if (onLog) onLog(msg, isError); };
    log("🔍 獲取可用模型...");

    let candidateModels = [];
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (listRes.ok) {
            const listData = await listRes.json();
            if (listData.models && Array.isArray(listData.models)) {
                candidateModels = listData.models
                    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                    .map(m => m.name.replace(/^models\//, ''));
            }
        }
    } catch (e) {}

    if (candidateModels.length === 0) {
        candidateModels = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"];
    }

    let lastError = null;
    for (const model of candidateModels) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        try {
            log(`⏳ 分析中 [${model}]...`);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            const responseText = await response.text();
            let data = JSON.parse(responseText);

            if (response.ok && data.candidates && data.candidates[0]) {
                log(`🎉 分析完成！`);
                return data;
            }
        } catch (err) {
            lastError = err.message;
        }
    }
    throw new Error(lastError || "連線至 Gemini API 失敗");
}

function renderGrammaticalForm(formText) {
    if (!formText || formText === '-') return '-';

    let isIrregularVerb = formText.includes("不規則動詞") || formText.includes("三態變化") || formText.includes("➔");
    let isIrregularNoun = formText.includes("不規則名詞") || formText.includes("【不規則】") || formText.includes("不規則");
    let isSameForm = formText.includes("單複數同形");

    let badgeHTML = "";
    if (isIrregularVerb) badgeHTML = `<span class="alert-badge badge-irregular-verb">🔥 不規則動詞</span>`;
    else if (isSameForm) badgeHTML = `<span class="alert-badge badge-same-form">💡 單複數同形</span>`;
    else if (isIrregularNoun) badgeHTML = `<span class="alert-badge badge-irregular-noun">⚠️ 不規則</span>`;

    let formattedText = formText.replace(/\*\*(.*?)\*\*/g, '<span class="irregular-highlight">$1</span>');
    return `<span>${formattedText} ${badgeHTML}</span>`;
}

function renderVerbTensesBox(vt) {
    if (!vt || typeof vt !== 'object' || !vt.base || vt.base === 'N/A' || vt.base === '-') return '';
    return `
        <div style="background: #fcf8f2; border: 1px solid #eddcca; border-radius: var(--radius-sm); padding: 8px 10px; margin: 8px 0;">
            <div style="font-weight: 600; color: #8a5323; margin-bottom: 4px; font-size: 0.82rem;">🔥 動詞三態：</div>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; font-size: 0.8rem;">
                <div style="background: white; padding: 4px 6px; border-radius: 4px; border: 1px solid #f2e6d8;"><strong>原形:</strong> ${vt.base || '-'}</div>
                <div style="background: white; padding: 4px 6px; border-radius: 4px; border: 1px solid #f2e6d8;"><strong>過去:</strong> ${vt.past || '-'}</div>
                <div style="background: white; padding: 4px 6px; border-radius: 4px; border: 1px solid #f2e6d8;"><strong>分詞:</strong> ${vt.pastParticiple || '-'}</div>
                <div style="background: white; padding: 4px 6px; border-radius: 4px; border: 1px solid #f2e6d8;"><strong>現分:</strong> ${vt.presentParticiple || '-'}</div>
            </div>
        </div>
    `;
}

function renderTargetScoreBadge(targetScore) {
    if (!targetScore || targetScore === '-') return '';
    let bg = '#f2f7fa', color = '#2b5578', border = '#cee0ec';
    if (targetScore.includes('860')) { bg = '#fcf8f2'; color = '#8a5323'; border = '#eddcca'; }
    else if (targetScore.includes('750')) { bg = '#f2f7f4'; color = '#2d5e3c'; border = '#cbe0d2'; }
    return `<span style="background: ${bg}; color: ${color}; border: 1px solid ${border}; padding: 2px 6px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; display: inline-flex; align-items: center;">🎯 ${targetScore}</span>`;
}

    const displayWord = sanitizeWord(item.word);
    const posText = item.partOfSpeech ? `<span class="pos-tag">(${item.partOfSpeech})</span>` : '';
    const phoneticText = item.phonetic ? `<span class="phonetic-tag">[${item.phonetic}]</span>` : '';
    const categoryBadge = item.category ? `<span class="category-badge">🏷️ ${item.category}</span>` : '';
    const targetScoreBadge = renderTargetScoreBadge(item.targetScore);
    const verbTensesHTML = renderVerbTensesBox(item.verbTenses);

    const derivativesList = Array.isArray(item.derivatives) && item.derivatives.length ? item.derivatives.join("； ") : (item.derivatives || '-');
    const collocationsList = Array.isArray(item.collocations) && item.collocations.length ? item.collocations.join("； ") : (item.collocations || '-');
    const synonymsList = Array.isArray(item.synonyms) && item.synonyms.length ? item.synonyms.join(", ") : (item.synonyms || '-');
    const antonymsList = Array.isArray(item.antonyms) && item.antonyms.length ? item.antonyms.join(", ") : (item.antonyms || '-');
    const confusablesList = Array.isArray(item.confusables) && item.confusables.length ? item.confusables.join("； ") : (item.confusables || '-');

    const ex1HTML = formatExampleHTML(item.example1_en, item.example1_zh, item.example1, 1);
    const ex2HTML = formatExampleHTML(item.example2_en, item.example2_zh, item.example2, 2);
    const ex3HTML = formatExampleHTML(item.example3_en, item.example3_zh, null, 3);
    const formHTML = renderGrammaticalForm(item.grammaticalForm);

    return `

            <div style="font-size:1.2rem; font-weight:700; color:var(--color-primary); display:flex; flex-wrap:wrap; align-items:center; gap:4px;">
                <span>${displayWord}</span> ${posText} ${phoneticText}
                <span class="zh-wrapper">
                    <button class="zh-toggle-btn" onclick="toggleZh(this)">👁️</button>
                    <span class="zh-text hidden" style="font-weight:normal; color:var(--text-muted); font-size:0.95rem;">[${item.chinese}]</span>
                </span>
            </div>
            <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:4px;">${categoryBadge} ${targetScoreBadge}</div>
            
            <div class="detail-content">
                ${verbTensesHTML}
                <p><strong>📌 詞性形態：</strong>${formHTML}</p>
                <p><strong>🧩 字根拆解：</strong>${item.rootAnalysis || '-'}</p>
                <p><strong>💡 多益考點：</strong>${item.toeic || '-'}</p>
                <p><strong>💼 商務句型：</strong>${item.businessContext || '-'}</p>
                <p><strong>🎧 聽力干擾：</strong>${item.listeningDistractors || '-'}</p>
                <p><strong>💡 記憶口訣：</strong>${item.mnemonicTip || '-'}</p>
                <p><strong>🇬🇧🇺🇸 英美差異：</strong>${item.ukUsVariation || '無差異'}</p>
                <p><strong>📖 Part 7 同義：</strong>${item.part7Synonyms || '-'}</p>
                <p><strong>⚠️ 文法陷阱：</strong>${item.grammarTraps || '-'}</p>
                <p><strong>🌱 衍生字：</strong>${derivativesList}</p>
                <p><strong>🔗 搭配詞：</strong>${collocationsList}</p>
                <p><strong>⚠️ 易混淆：</strong>${confusablesList}</p>
                <p><strong>🔄 同/反義：</strong>同: ${synonymsList} ｜ 反: ${antonymsList}</p>
                ${ex1HTML}
                ${ex2HTML}
                ${ex3HTML}
            </div>
            ${isSearchResult ? `<button class="primary" style="width:100%; margin-top:10px;" onclick="addCurrentToList()">➕ 保存至我的單字庫</button>` : ''}
        </div>
    `;
}

async function addCurrentToList() {
    if (!currentResultData) return;
    currentResultData.word = sanitizeWord(currentResultData.word);

    const words = getWords();
    const existingIndex = words.findIndex(w => w.word.toLowerCase() === currentResultData.word.toLowerCase());
    const now = Date.now();
    const newWordObj = {
        ...currentResultData,
        mastery: 0,
        nextReviewDate: now,
        lastReviewedAt: 0,
        createdAt: now,
        updatedAt: now,
        isDeleted: false
    };

    if (existingIndex !== -1) {
        if (confirm(`單字「${words[existingIndex].word}」已存在，要覆蓋更新嗎？`)) {
            words[existingIndex] = { ...words[existingIndex], ...newWordObj, createdAt: words[existingIndex].createdAt || now, updatedAt: now };
            saveWords(words);
            alert(`✅ 已覆蓋更新！`);
        }
        return;
    }

    words.unshift(newWordObj);
    saveWords(words);
    alert("✅ 已成功儲存！");
}

function markMastery(realIndex, isRemembered) {
    const words = getWords();
    const item = words[realIndex];
    if (!item) return;

    let currentLevel = item.mastery || 0;
    currentLevel = isRemembered ? Math.min(currentLevel + 1, 5) : 0;

    const intervalDays = SRS_INTERVALS[currentLevel];
    const now = Date.now();
    const nextDate = isRemembered ? (now + intervalDays * 24 * 60 * 60 * 1000) : now;

    words[realIndex] = { ...item, mastery: currentLevel, nextReviewDate: nextDate, lastReviewedAt: now, updatedAt: now };
    saveWords(words);
}

function toggleDueOnlyFilter() {
    filterDueOnly = !filterDueOnly;
    const btn = document.getElementById("filterDueBtn");
    if (filterDueOnly) {
        btn.classList.remove("warning");
        btn.classList.add("primary");
        btn.innerHTML = `🎯 顯示全部`;
    } else {
        btn.classList.remove("primary");
        btn.classList.add("warning");
    }
    renderWordList();
}

function handleFilterInput() {
    const filterInput = document.getElementById("filterInput");
    const clearBtn = document.getElementById("clearSearchBtn");
    if (filterInput && clearBtn) {
        clearBtn.style.display = filterInput.value.trim() ? "block" : "none";
    }
    renderWordList();
}

function clearSearchFilter() {
    const filterInput = document.getElementById("filterInput");
    const clearBtn = document.getElementById("clearSearchBtn");
    if (filterInput) filterInput.value = "";
    if (clearBtn) clearBtn.style.display = "none";
    renderWordList();
}

async function updateSingleWord(index, btnEvt) {
    const words = getWords();
    const item = words[index];
    if (!item) return;

    const cleanWord = sanitizeWord(item.word);
    if (!confirm(`確定重新分析「${cleanWord}」嗎？`)) return;

    const btn = btnEvt ? btnEvt.target : null;
    let oldBtnText = "";
    if (btn) { oldBtnText = btn.innerHTML; btn.disabled = true; btn.innerHTML = "⏳..."; }

    try {
        const prompt = `你是一位專業的 TOEIC 專家。深度分析英文單字："${cleanWord}"。回覆 JSON 格式包含完整多益考點與例句。`;
        const data = await fetchGeminiAPI(prompt);
        const rawText = data.candidates[0].content.parts[0].text;
        const newInfo = safeJSONParseAI(rawText);

        if (newInfo && newInfo.word) newInfo.word = sanitizeWord(newInfo.word);

        const now = Date.now();
        words[index] = { ...item, ...newInfo, createdAt: item.createdAt || now, updatedAt: now };
        saveWords(words);
        alert(`✅ 已更新「${cleanWord}」！`);
    } catch (err) {
        alert(`❌ 更新失敗：${err.message}`);
    } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = oldBtnText; }
    }
}

function isWordIncomplete(item) {
    if (!item) return true;
    const isEmptyStr = (val) => !val || typeof val !== 'string' || val.trim() === '' || val.trim() === '-';
    const isEmptyArr = (val) => !Array.isArray(val) || val.length === 0;

    return (
        isEmptyStr(item.partOfSpeech) ||
        isEmptyStr(item.phonetic) ||
        isEmptyStr(item.category) ||
        isEmptyStr(item.businessContext) ||
        isEmptyArr(item.derivatives) ||
        !item.example3_en
    );
}

async function upgradeOldWords(evt) {
    const words = getWords();
    const outdatedIndices = [];
    words.forEach((item, index) => {
        if (!item.isDeleted && isWordIncomplete(item)) outdatedIndices.push(index);
    });

    if (outdatedIndices.length === 0) return alert("🎉 所有單字皆已有完整資訊！");
    if (!confirm(`找到 ${outdatedIndices.length} 個待補齊單字，開始補齊？`)) return;

    let successCount = 0;
    const upgradeBtn = evt ? evt.currentTarget : null;
    if (upgradeBtn) upgradeBtn.disabled = true;

    for (let i = 0; i < outdatedIndices.length; i++) {
        const idx = outdatedIndices[i];
        const item = words[idx];
        const cleanWord = sanitizeWord(item.word);

        if (upgradeBtn) upgradeBtn.innerHTML = `⏳ (${i + 1}/${outdatedIndices.length})`;

        try {
            if (i > 0) await new Promise(r => setTimeout(r, 2500));
            const prompt = `深度分析 TOEIC 單字："${cleanWord}"，回覆 JSON。`;
            const data = await fetchGeminiAPI(prompt);
            const rawText = data.candidates[0].content.parts[0].text;
            const newInfo = safeJSONParseAI(rawText);

            if (newInfo && newInfo.word) newInfo.word = sanitizeWord(newInfo.word);

            const now = Date.now();
            words[idx] = { ...item, ...newInfo, createdAt: item.createdAt || now, updatedAt: now };
            successCount++;
            saveWords(words, false);
        } catch (err) {
            console.error(err);
        }
    }

    if (upgradeBtn) { upgradeBtn.disabled = false; upgradeBtn.innerHTML = "⚡ 補齊"; }
    await performFullSync(false);
    alert(`🎉 補全作業完成！成功 ${successCount} 個。`);
}

function renderWordList() {
    let allWords = getWords();
    let activeWords = allWords.filter(item => !item.isDeleted);

    const now = Date.now();
    const filterText = document.getElementById("filterInput") ? document.getElementById("filterInput").value.toLowerCase().trim() : "";
    const sortType = document.getElementById("sortSelect") ? document.getElementById("sortSelect").value : "time-desc";
    const wordListDiv = document.getElementById("wordList");
    const localCountSpan = document.getElementById("localWordCount");
    const dueCountSpan = document.getElementById("dueCount");

    if (localCountSpan) localCountSpan.textContent = activeWords.length;
    updateSyncStatusDisplay('normal');

    const dueWordsList = activeWords.filter(item => !item.nextReviewDate || item.nextReviewDate <= now);
    const learningWords = activeWords.filter(item => (item.mastery || 0) > 0 && (item.mastery || 0) < 5);
    const masteredWords = activeWords.filter(item => (item.mastery || 0) === 5);

    if (dueCountSpan) dueCountSpan.textContent = dueWordsList.length;

    const statDue = document.getElementById("statDue");
    const statLearning = document.getElementById("statLearning");
    const statMastered = document.getElementById("statMastered");
    if (statDue) statDue.textContent = dueWordsList.length;
    if (statLearning) statLearning.textContent = learningWords.length;
    if (statMastered) statMastered.textContent = masteredWords.length;

    let filteredWords = activeWords.filter(item => {
        const matchesQuery = item.word.toLowerCase().includes(filterText) || 
                            (item.chinese && item.chinese.toLowerCase().includes(filterText));
        if (filterDueOnly) return matchesQuery && (!item.nextReviewDate || item.nextReviewDate <= now);
        return matchesQuery;
    });

    filteredWords.sort((a, b) => {
        const timeA = getItemTime(a), timeB = getItemTime(b);
        const wordA = a.word.toLowerCase(), wordB = b.word.toLowerCase();
        const dueA = !a.nextReviewDate || a.nextReviewDate <= now;
        const dueB = !b.nextReviewDate || b.nextReviewDate <= now;
        const levelA = a.mastery || 0, levelB = b.mastery || 0;

        if (sortType === "srs-due") {
            if (dueA && !dueB) return -1;
            if (!dueA && dueB) return 1;
            return (a.nextReviewDate || 0) - (b.nextReviewDate || 0);
        }
        if (sortType === "srs-level-asc") return levelA - levelB;
        if (sortType === "srs-level-desc") return levelB - levelA;
        if (sortType === "time-desc") return timeB - timeA;
        if (sortType === "time-asc") return timeA - timeB;
        if (sortType === "alpha-asc") return wordA.localeCompare(wordB);
        if (sortType === "alpha-desc") return wordB.localeCompare(wordA);
        return 0;
    });

    if (filteredWords.length === 0) {
        if (filterDueOnly) {
            wordListDiv.innerHTML = "<p style='color:#326042; font-weight:600; padding:10px; background:#e2ede5; border-radius:var(--radius-sm); text-align:center;'>🎉 目前沒有需要複習的單字！</p>";
        } else {
            wordListDiv.innerHTML = filterText ? "<p style='color:var(--text-muted); text-align:center;'>沒有符合條件的單字。</p>" : "<p style='color:var(--text-muted); text-align:center;'>目前尚無儲存的單字。</p>";
        }
        return;
    }

    wordListDiv.innerHTML = filteredWords.map((item) => {
        const realIndex = allWords.findIndex(w => w.word.toLowerCase() === item.word.toLowerCase());
        const cleanWord = sanitizeWord(item.word);
        const displayTime = getItemTime(item);
        const timeString = displayTime ? new Date(displayTime).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '無紀錄';

        const posTag = item.partOfSpeech ? `<span class="pos-tag">(${item.partOfSpeech})</span>` : '';
        const phoneticText = item.phonetic ? `<span class="phonetic-tag">[${item.phonetic}]</span>` : '';
        const categoryBadge = item.category ? `<span class="category-badge">🏷️ ${item.category}</span>` : '';
        const targetScoreBadge = renderTargetScoreBadge(item.targetScore);
        const verbTensesHTML = renderVerbTensesBox(item.verbTenses);

        const level = item.mastery || 0;
        const stars = "★".repeat(level) + "☆".repeat(5 - level);
        const isDue = !item.nextReviewDate || item.nextReviewDate <= now;
        
        let dueStatusHTML = isDue ? `<span class="srs-due-tag">🎯 待複習</span>` : `<span class="srs-ok-tag">⏳ ${new Date(item.nextReviewDate).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })}</span>`;

        const derivativesList = Array.isArray(item.derivatives) && item.derivatives.length ? item.derivatives.join("； ") : (item.derivatives || '-');
        const collocationsList = Array.isArray(item.collocations) && item.collocations.length ? item.collocations.join("； ") : (item.collocations || '-');
        const synonymsList = Array.isArray(item.synonyms) && item.synonyms.length ? item.synonyms.join(", ") : (item.synonyms || '-');
        const antonymsList = Array.isArray(item.antonyms) && item.antonyms.length ? item.antonyms.join(", ") : (item.antonyms || '-');
        const confusablesList = Array.isArray(item.confusables) && item.confusables.length ? item.confusables.join("； ") : (item.confusables || '-');

        const ex1HTML = formatExampleHTML(item.example1_en, item.example1_zh, item.example1, 1);
        const ex2HTML = formatExampleHTML(item.example2_en, item.example2_zh, item.example2, 2);
        const ex3HTML = formatExampleHTML(item.example3_en, item.example3_zh, null, 3);
        const formHTML = renderGrammaticalForm(item.grammaticalForm);
        const safeWord = escapeJsStr(cleanWord);

        return `
            <div class="word-card">
                <div class="word-card-top">
                    <div style="font-size:0.78rem; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
                        <span>📅 ${timeString}</span>
                        <span>Level ${level}</span>
                    </div>
                    <div class="word-actions">
                        <button class="success btn-sm" onclick="markMastery(${realIndex}, true)">✅ 記得</button>
                        <button class="danger btn-sm" onclick="markMastery(${realIndex}, false)">❌ 忘記</button>
                        <button class="voice-female btn-sm" onclick="speakText('${safeWord}', 'female')">👩 發音</button>
                        <button class="voice-male btn-sm" onclick="speakText('${safeWord}', 'male')">👨 發音</button>
                        <button class="primary btn-sm" onclick="updateSingleWord(${realIndex}, event)">✨ 重整</button>
                        <button class="danger btn-sm" onclick="deleteWord(${realIndex})">🗑️ 刪除</button>
                    </div>
                </div>

                <div class="srs-box">
                    <span>熟練度 <span class="srs-star">${stars}</span></span>
                    ${dueStatusHTML}
                </div>

                <details style="margin-top:6px;">
                    <summary>
                        ${cleanWord} ${posTag} ${phoneticText}
                        <span class="zh-wrapper">
                            <button class="zh-toggle-btn" onclick="event.stopPropagation(); toggleZh(this);">👁️</button>
                            <span class="zh-text hidden" style="font-weight:normal; color:var(--text-muted); font-size:0.92rem;">[${item.chinese}]</span>
                        </span>
                        <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:2px;">${categoryBadge} ${targetScoreBadge}</div>
                    </summary>
                    <div class="detail-content">
                        ${verbTensesHTML}
                        <p><strong>📌 詞性形態：</strong>${formHTML}</p>
                        <p><strong>🧩 字根拆解：</strong>${item.rootAnalysis || '-'}</p>
                        <p><strong>💡 多益考點：</strong>${item.toeic || '-'}</p>
                        <p><strong>💼 商務句型：</strong>${item.businessContext || '-'}</p>
                        <p><strong>🎧 聽力干擾：</strong>${item.listeningDistractors || '-'}</p>
                        <p><strong>💡 記憶口訣：</strong>${item.mnemonicTip || '-'}</p>
                        <p><strong>🇬🇧🇺🇸 英美差異：</strong>${item.ukUsVariation || '無差異'}</p>
                        <p><strong>📖 Part 7 同義：</strong>${item.part7Synonyms || '-'}</p>
                        <p><strong>⚠️ 文法陷阱：</strong>${item.grammarTraps || '-'}</p>
                        <p><strong>🌱 衍生字：</strong>${derivativesList}</p>
                        <p><strong>🔗 搭配詞：</strong>${collocationsList}</p>
                        <p><strong>⚠️ 易混淆：</strong>${confusablesList}</p>
                        <p><strong>🔄 同/反義：</strong>同: ${synonymsList} ｜ 反: ${antonymsList}</p>
                        ${ex1HTML}
                        ${ex2HTML}
                        ${ex3HTML}
                    </div>
                </details>
            </div>
        `;
    }).join('');
}

function toggleAllDetails(open) {
    document.querySelectorAll('#wordList details').forEach(detail => detail.open = open);
}

async function deleteWord(index) {
    if (confirm("確定刪除這個單字？")) {
        const words = getWords();
        if (words[index]) {
            words[index] = { ...words[index], isDeleted: true, updatedAt: Date.now() };
            saveWords(words);
        }
    }
}

function exportData() {
    const words = getWords().filter(item => !item.isDeleted);
    if (words.length === 0) return alert("單字庫是空的。");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `TOEIC_Vocab_Backup_${new Date().toISOString().slice(0,10)}.json`);
    downloadAnchor.click();
    downloadAnchor.remove();
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const importedWords = safeParseJSON(e.target.result);
            if (!Array.isArray(importedWords)) throw new Error("非 JSON 陣列格式");
            
            const currentWords = getWords();
            const merged = mergeDatasets(currentWords, importedWords);

            saveWords(merged);
            alert(`✅ 匯入成功！共 ${merged.filter(w => !w.isDeleted).length} 個單字。`);
        } catch (err) {
            alert(`匯入失敗：${err.message}`);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && getGitHubToken()) performFullSync(false);
});

window.addEventListener('DOMContentLoaded', () => {
    renderWordList();
    if (getGitHubToken()) performFullSync(false);
});
